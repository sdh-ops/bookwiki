name: Bestseller Data Sync

on:
  schedule:
    # 6:00 AM KST is 9:00 PM UTC (21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 알라딘은 누락된 출판사·출간일을 메우는 **폴백**에만 쓴다(수집 본체는 HTML 스크래핑).
          # 2026-09-05 에 키를 하드코딩에서 환경변수로 뺐다 — 이 줄이 없으면 그 보완이 조용히 멈춘다.
          # ⚠️ 알라딘 Open API 는 2026-10-30 종료. 그 뒤엔 이 값이 있어도 폴백은 안 돈다.
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
        run: node scripts/bestseller-final.js
