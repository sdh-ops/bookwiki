name: Bestseller Data Sync

on:
  schedule:
    # 6:00 AM KST is 9:00 PM UTC (21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 출판사·출간일 보완은 **폴백**이다(수집 본체는 HTML 스크래핑).
          # 1순위 YES24 Open API · 2순위 알라딘(2026-10-30 종료).
          # ⚠️ YES24 키는 더난 ERP 와 같은 키다 — 일 20,000회를 나눠 쓴다.
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
        run: node scripts/bestseller-final.js
